  <form>

    <div class="mb-3">
      <label for="query" class="form-label">Query</label>
      <textarea class="form-control" id="query" name="query" rows="5"></textarea>
    </div>

    <button type="submit" class="btn btn-primary">Submit</button>
  </form>
